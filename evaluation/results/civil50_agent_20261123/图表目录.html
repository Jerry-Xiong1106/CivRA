<p><a href="Civil50_图册.pdf">整本矢量 PDF</a> · <a href="评测报告.md">指标、口径与局限</a></p></header><nav><a href="#01_overview">01　总体表现</a><a href="#02_case_types">02　案件类型表现</a><a href="#03_rubric_dimensions">03　五维评分：案型差异</a><a href="#04_case_score_matrix">04　逐案评分矩阵</a><a href="#05_keyword_hits">05　追问关键词与缺口覆盖</a><a href="#06_turn_timeline">06　50 个会话的交互轨迹</a><a href="#07_endpoints">07　路线终点与受阻</a><a href="#08_tools">08　业务工具频次与状态</a><a href="#09_rag_retrieval">09　法条检索质量与上下文</a><a href="#10_rag_ranks">10　首检前五位的候选质量</a><a href="#11_similar_cases">11　类案推荐：覆盖与准确性</a><a href="#12_efficiency">12　执行效率与资源用量</a><a href="#13_answer_citations">13　回答质量与引用可追溯性</a><a href="#14_materials_recovery">14　材料使用、推进与修订</a><a href="#15_case_type_matrix">15　路线选择前的案由识别矩阵</a><a href="#16_split_comparison">16　开发集与待评审集</a><a href="#17_token_usage">17　Token 用量：总量与长尾</a><a href="#18_tool_error_reasons">18　工具调用错误的具体原因</a></nav><figure id="01_overview"><img loading="lazy" src="figures/01_overview.png" alt="总体表现"><figcaption>严格成功要求全部评分项满分、达成约定终点且无严重错误。交付结构与终稿质量单独计数。 <a href="figures/01_overview.pdf">矢量 PDF</a> · <a href="figures/01_overview.png">300 dpi PNG</a></figcaption></figure><figure id="02_case_types"><img loading="lazy" src="figures/02_case_types.png" alt="案件类型表现"><figcaption>案由命中取进入指定路线前的结构化字段。关键词为逐案两项的扩展命中。右图展示样本均值，误差线为标准差。 <a href="figures/02_case_types.pdf">矢量 PDF</a> · <a href="figures/02_case_types.png">300 dpi PNG</a></figcaption></figure><figure id="03_rubric_dimensions"><img loading="lazy" src="figures/03_rubric_dimensions.png" alt="五维评分：案型差异"><figcaption>采用数据集固定的五维权重。每格是案型内的维度均分（%），保留个案分数与全部分母供复核。 <a href="figures/03_rubric_dimensions.pdf">矢量 PDF</a> · <a href="figures/03_rubric_dimensions.png">300 dpi PNG</a></figcaption></figure><figure id="04_case_score_matrix"><img loading="lazy" src="figures/04_case_score_matrix.png" alt="逐案评分矩阵"><figcaption>每行一案，格中数字为单项 0/1/2 分。右侧列出百分制总分。编号对应 Civil50，原文与参考答案留在本地审计记录中。 <a href="figures/04_case_score_matrix.pdf">矢量 PDF</a> · <a href="figures/04_case_score_matrix.png">300 dpi PNG</a></figcaption></figure><figure id="05_keyword_hits"><img loading="lazy" src="figures/05_keyword_hits.png" alt="追问关键词与缺口覆盖"><figcaption>关键词基于预定的字面表达及同义词。左图以每案两个指定缺口为分母，右图以实际发问为分母；系统卡片和模型发问分开计。 <a href="figures/05_keyword_hits.pdf">矢量 PDF</a> · <a href="figures/05_keyword_hits.png">300 dpi PNG</a></figcaption></figure><figure id="06_turn_timeline"><img loading="lazy" src="figures/06_turn_timeline.png" alt="50 个会话的交互轨迹"><figcaption>按实际用户提交轮次绘制，各案最多 20 轮。选择路线、正常回答、确认、修订和继续办理均在原会话中记录。 <a href="figures/06_turn_timeline.pdf">矢量 PDF</a> · <a href="figures/06_turn_timeline.png">300 dpi PNG</a></figcaption></figure><figure id="07_endpoints"><img loading="lazy" src="figures/07_endpoints.png" alt="路线终点与受阻"><figcaption>咨询以非空完整正文为结构终点。协商、调解查可读 Word 及待反馈状态；诉讼还需证据目录和可读起诉状。 <a href="figures/07_endpoints.pdf">矢量 PDF</a> · <a href="figures/07_endpoints.png">300 dpi PNG</a></figcaption></figure><figure id="08_tools"><img loading="lazy" src="figures/08_tools.png" alt="业务工具频次与状态"><figcaption>只数 trace 中的业务工具调用。空结果、条件不足和代码错误分别编码；被拦的调用可以没有实际执行尝试。 <a href="figures/08_tools.pdf">矢量 PDF</a> · <a href="figures/08_tools.png">300 dpi PNG</a></figcaption></figure><figure id="09_rag_retrieval"><img loading="lazy" src="figures/09_rag_retrieval.png" alt="法条检索质量与上下文"><figcaption>主图以同一 0–100% 尺度显示检索质量、参考条覆盖和实际上下文。本地版本对照条目为既有标注，可能未穷尽适用法源。 <a href="figures/09_rag_retrieval.pdf">矢量 PDF</a> · <a href="figures/09_rag_retrieval.png">300 dpi PNG</a></figcaption></figure><figure id="10_rag_ranks"><img loading="lazy" src="figures/10_rag_ranks.png" alt="首检前五位的候选质量"><figcaption>每个排名位以发生过首检的案件为分母。候选相关性按预标条文集合计算，未检出、重复与空位均保留。 <a href="figures/10_rag_ranks.pdf">矢量 PDF</a> · <a href="figures/10_rag_ranks.png">300 dpi PNG</a></figcaption></figure><figure id="11_similar_cases"><img loading="lazy" src="figures/11_similar_cases.png" alt="类案推荐：覆盖与准确性"><figcaption>当前版本的 Agent 工具目录无在线类案查询。前端图谱的 9 条固定案例用独立相关标签测试，分别报告覆盖与精确率。 <a href="figures/11_similar_cases.pdf">矢量 PDF</a> · <a href="figures/11_similar_cases.png">300 dpi PNG</a></figcaption></figure><figure id="12_efficiency"><img loading="lazy" src="figures/12_efficiency.png" alt="执行效率与资源用量"><figcaption>每点是一案。点的轻微纵向抖动仅便于区分样本，黑线标示中位数及四分位范围。活跃时长不含等待用户。 <a href="figures/12_efficiency.pdf">矢量 PDF</a> · <a href="figures/12_efficiency.png">300 dpi PNG</a></figcaption></figure><figure id="13_answer_citations"><img loading="lazy" src="figures/13_answer_citations.png" alt="回答质量与引用可追溯性"><figcaption>结论可以在正文中引用法条，也可能额外输出结构化引文。此处审计结构化绑定及答案评分，精确定位属于可追溯性。 <a href="figures/13_answer_citations.pdf">矢量 PDF</a> · <a href="figures/13_answer_citations.png">300 dpi PNG</a></figcaption></figure><figure id="14_materials_recovery"><img loading="lazy" src="figures/14_materials_recovery.png" alt="材料使用、推进与修订"><figcaption>每案预置两份可按需披露的摘记。回复推进只判可观察的新待办或成果；修订指标只评有实际触发的预定修订。 <a href="figures/14_materials_recovery.pdf">矢量 PDF</a> · <a href="figures/14_materials_recovery.png">300 dpi PNG</a></figcaption></figure><figure id="15_case_type_matrix"><img loading="lazy" src="figures/15_case_type_matrix.png" alt="路线选择前的案由识别矩阵"><figcaption>空白表示运行未在结构化字段写入案由。租赁在当前支持范围中通常标为“其他”，按四分类任务仍记未命中。 <a href="figures/15_case_type_matrix.pdf">矢量 PDF</a> · <a href="figures/15_case_type_matrix.png">300 dpi PNG</a></figcaption></figure><figure id="16_split_comparison"><img loading="lazy" src="figures/16_split_comparison.png" alt="开发集与待评审集"><figcaption>候选集尚待独立评审。图中仅描述两组样本，不进行显著性检验。单案分布的黑线是组中位数及四分位范围。 <a href="figures/16_split_comparison.pdf">矢量 PDF</a> · <a href="figures/16_split_comparison.png">300 dpi PNG</a></figcaption></figure><figure id="17_token_usage"><img loading="lazy" src="figures/17_token_usage.png" alt="Token 用量：总量与长尾"><figcaption>Token 来自主 Agent 接口的使用量记录。图示含输入与输出，不包括未并入主 Agent 的业务网关或嵌入用量。 <a href="figures/17_token_usage.pdf">矢量 PDF</a> · <a href="figures/17_token_usage.png">300 dpi PNG</a></figcaption></figure><figure id="18_tool_error_reasons"><img loading="lazy" src="figures/18_tool_error_reasons.png" alt="工具调用错误的具体原因"><figcaption>仅统计 status=error 的调用。输入、来源或版本检查通过拒绝保护了案件数据，重试和恢复结果另见明细。 <a href="figures/18_tool_error_reasons.pdf">矢量 PDF</a> · <a href="figures/18_tool_error_reasons.png">300 dpi PNG</a></figcaption></figure></main></html>
